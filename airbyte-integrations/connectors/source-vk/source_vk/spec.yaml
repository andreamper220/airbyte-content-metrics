documentationUrl: https://dev.vk.com/ru/method/video.get
connectionSpecification:
  $schema: https://json-schema.org/draft-07/schema#
  title: VK Short Videos Spec
  type: object
  required:
    - access_token
    - owner_id
  additionalProperties: true
  properties:
    access_token:
      type: string
      title: Access Token
      description: VK service or user access token with video scope.
      airbyte_secret: true
      order: 0
    owner_id:
      type: integer
      title: Owner ID
      description: User or community ID that owns the videos. Use negative value for communities (e.g. -123456789).
      order: 1
    api_version:
      type: string
      title: API Version
      description: VK API version.
      default: "5.199"
      order: 2
    start_date:
      type: string
      title: Start Date
      description: Only sync videos published on or after this date (YYYY-MM-DD). Optional.
      pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
      format: date
      examples:
        - "2024-01-01"
      order: 3
    max_short_duration_seconds:
      type: integer
      title: Max Short Duration (seconds)
      description: Treat videos with duration up to this value as short-form content.
      default: 180
      minimum: 1
      maximum: 600
      order: 4
    page_size:
      type: integer
      title: Page Size
      description: Number of videos per API request (max 200).
      default: 100
      minimum: 1
      maximum: 200
      order: 5
