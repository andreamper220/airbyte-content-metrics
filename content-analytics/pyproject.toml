[project]
name = "content-analytics"
version = "0.1.0"
description = "Cross-platform content analytics dashboard"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "clickhouse-connect>=0.8.0",
    "pydantic-settings>=2.6.0",
    "authlib>=1.3.0",
    "httpx>=0.27.0",
    "itsdangerous>=2.2.0",
]

[project.scripts]
content-analytics = "app.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
