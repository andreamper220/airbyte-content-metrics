# Unified VPS stack: ClickHouse + dashboard + (optional) connector image builds.
#
# Airbyte OSS itself runs via abctl (kind + Helm) — see bootstrap.sh.
# Plain docker-compose for the Airbyte platform is no longer supported upstream.
#
# Quick start:
#   cp .env.example .env && nano .env
#   ./bootstrap.sh

name: content-metrics

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    restart: unless-stopped
    ports:
      # Bind address is configurable — abctl/kind on Linux must reach the host port.
      # Keep 8123 closed in the public firewall (ufw/security group).
      - "${CLICKHOUSE_HOST_BIND:-127.0.0.1}:8123:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ../content-analytics/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-analytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - analytics
    deploy:
      resources:
        limits:
          memory: 2G

  app:
    build:
      context: ../content-analytics
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_HOST_BIND:-127.0.0.1}:${APP_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-analytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD in .env}
      AUTO_REFRESH_ENABLED: ${AUTO_REFRESH_ENABLED:-true}
      MART_REFRESH_INTERVAL_MINUTES: ${MART_REFRESH_INTERVAL_MINUTES:-15}
      AIRBYTE_SYNC_ENABLED: ${AIRBYTE_SYNC_ENABLED:-false}
      AIRBYTE_SYNC_INTERVAL_MINUTES: ${AIRBYTE_SYNC_INTERVAL_MINUTES:-15}
      AIRBYTE_API_URL: ${AIRBYTE_API_URL:-}
      AIRBYTE_USERNAME: ${AIRBYTE_USERNAME:-}
      AIRBYTE_PASSWORD: ${AIRBYTE_PASSWORD:-}
      AIRBYTE_CONNECTION_IDS: ${AIRBYTE_CONNECTION_IDS:-}
      DZEN_CHANNEL_NAME: ${DZEN_CHANNEL_NAME:-}
      DZEN_SESSION_ID: ${DZEN_SESSION_ID:-}
      DZEN_CSRF_TOKEN: ${DZEN_CSRF_TOKEN:-}
      DZEN_SESS_ID: ${DZEN_SESS_ID:-}
      ZEN_SESSION_ID: ${ZEN_SESSION_ID:-}
      DZEN_COOKIE_PATH: ${DZEN_COOKIE_PATH:-/secrets/dzen-comment.json}
      DZEN_FP_TOKEN: ${DZEN_FP_TOKEN:-}
      YOUTUBE_TOKEN_PATH: ${YOUTUBE_TOKEN_PATH:-/secrets/youtube-comment-token.json}
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      YOUTUBE_REFRESH_TOKEN: ${YOUTUBE_REFRESH_TOKEN:-}
      YOUTUBE_CHANNEL_ID: ${YOUTUBE_CHANNEL_ID:-}
      VK_ACCESS_TOKEN: ${VK_ACCESS_TOKEN:-}
      VK_OWNER_ID: ${VK_OWNER_ID:-}
      VK_COMMENT_FROM_GROUP: ${VK_COMMENT_FROM_GROUP:-true}
      VK_CONFIG_PATH: ${VK_CONFIG_PATH:-/secrets/source-vk-config.json}
      COMMENT_CREDENTIALS_PATH: ${COMMENT_CREDENTIALS_PATH:-}
    volumes:
      - ./secrets:/secrets
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - analytics
    deploy:
      resources:
        limits:
          memory: 512M

  # Build custom connector images from this repo (not started on normal `up`).
  #   docker compose --profile build-connectors build
  source-tiktok-business:
    profiles: ["build-connectors"]
    build:
      context: ../airbyte-integrations/connectors/source-tiktok-business
      dockerfile: ../../../docker-images/Dockerfile.python-connector
      args:
        BASE_IMAGE: docker.io/airbyte/python-connector-base:4.0.0@sha256:d9894b6895923b379f3006fa251147806919c62b7d9021b5cd125bb67d7bbe22
        CONNECTOR_NAME: source-tiktok-business
    image: airbyte/source-tiktok-business:${TIKTOK_CONNECTOR_TAG:-dev}
    entrypoint: ["true"]

  source-vk:
    profiles: ["build-connectors"]
    build:
      context: ../airbyte-integrations/connectors/source-vk
      dockerfile: ../../../docker-images/Dockerfile.python-connector
      args:
        BASE_IMAGE: docker.io/airbyte/python-connector-base:4.0.0@sha256:d9894b6895923b379f3006fa251147806919c62b7d9021b5cd125bb67d7bbe22
        CONNECTOR_NAME: source-vk
    image: airbyte/source-vk:${VK_CONNECTOR_TAG:-dev}
    entrypoint: ["true"]

  source-dzen:
    profiles: ["build-connectors"]
    build:
      context: ../airbyte-integrations/connectors/source-dzen
      dockerfile: ../../../docker-images/Dockerfile.python-connector
      args:
        BASE_IMAGE: docker.io/airbyte/python-connector-base:4.0.0@sha256:d9894b6895923b379f3006fa251147806919c62b7d9021b5cd125bb67d7bbe22
        CONNECTOR_NAME: source-dzen
    image: airbyte/source-dzen:${DZEN_CONNECTOR_TAG:-dev}
    entrypoint: ["true"]

networks:
  analytics:
    name: content-analytics

volumes:
  clickhouse_data:
